name: Update index.html

on:
  push:
    branches:
      - main
    paths:
      - "Clash/**"
      - "custom/**"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check file list changes
        id: file_changes
        run: |
          if [ ! -f index.html ]; then
            echo "need_update=true" >> "$GITHUB_OUTPUT"
            echo "index.html does not exist, generate it."
            exit 0
          fi
      
          changed="$(git diff --name-status HEAD^ HEAD -- Clash custom | awk '$1 ~ /^[ADR]/ { print }')"
      
          if [ -n "$changed" ]; then
            echo "need_update=true" >> "$GITHUB_OUTPUT"
            echo "File list changed:"
            echo "$changed"
          else
            echo "need_update=false" >> "$GITHUB_OUTPUT"
            echo "Only file content changed, skip index.html update."
          fi

      - name: Generate index.html
        if: steps.file_changes.outputs.need_update == 'true'
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Clash Rules</title>
            <style>
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 16px;
                line-height: 1.6;
                color: #24292f;
              }

              h1 {
                font-size: 28px;
                margin-bottom: 24px;
              }

              details {
                margin: 8px 0;
              }

              summary {
                cursor: pointer;
                font-weight: 600;
                user-select: none;
              }

              ul {
                margin-top: 6px;
                margin-bottom: 10px;
              }

              li {
                margin: 4px 0;
              }

              a {
                color: #0969da;
                text-decoration: none;
              }

              a:hover {
                text-decoration: underline;
              }

              .path {
                color: #57606a;
                font-size: 13px;
              }
            </style>
          </head>
          <body>
            <h1>Clash Rules</h1>
          EOF

          generate_tree() {
            local dir="$1"
            local open_attr="$2"

            echo "            <details $open_attr>" >> index.html
            echo "              <summary>📁 $dir</summary>" >> index.html
            echo "              <ul>" >> index.html

            find "$dir" -type f | sort | while read -r file; do
              name="$(basename "$file")"
              path_dir="$(dirname "$file")"

              if [ "$path_dir" = "$dir" ]; then
                echo "                <li><a href=\"/$file\">$name</a> <span class=\"path\">/$file</span></li>" >> index.html
              else
                echo "                <li><a href=\"/$file\">$file</a></li>" >> index.html
              fi
            done

            echo "              </ul>" >> index.html
            echo "            </details>" >> index.html
          }

          generate_tree "custom" "open"
          generate_tree "Clash" ""

          cat >> index.html <<'EOF'
          </body>
          </html>
          EOF

      - name: Commit index.html
        if: steps.file_changes.outputs.need_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update index.html"
            git push
          fi